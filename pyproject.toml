[project]
name = "miniswe-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "logging>=0.4.9.6",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
miniswe-langgraph = "miniswe_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
